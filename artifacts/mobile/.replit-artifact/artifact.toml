kind = "mobile"
previewPath = "/mobile/"
title = "تبيان — Native Mobile V2"
description = "تطبيق Native للطلاب والمعلمين والمشرفين في منصة تبيان القرآنية، مبني بـ React Native وExpo Router ويستهلك عقود tRPC الحقيقية مع دعم RTL والثيم والمصحف."
version = "1.0.0"
id = "artifacts/mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 18115

[services.development]
run = "pnpm --filter @workspace/mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mobile", "run", "serve" ]

[services.env]
PORT = "18115"
BASE_PATH = "/mobile/"
